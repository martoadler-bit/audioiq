name: AudioIQ
options:
  bundleIdPrefix: com.apss
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: false
schemes:
  AudioIQ:
    build:
      targets:
        AudioIQ: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: en
    ENABLE_PREVIEWS: YES
targets:
  AudioIQ:
    type: application
    platform: iOS
    sources:
      - path: AudioIQ
    info:
      path: AudioIQ/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: Audio IQ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apss.audioiq
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
